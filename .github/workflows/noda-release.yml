name: noda-release

# Build and publish patched sccache binaries from a NODA release tag
# (e.g. v0.17.0-noda.1). Manual only: the upstream workflows are disabled on
# this fork, so nothing else builds or publishes releases.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        default: v0.17.0-noda.1

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-22.04
    container: ${{ matrix.container }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            container: messense/rust-musl-cross:x86_64-musl
          - target: aarch64-unknown-linux-musl
            container: messense/rust-musl-cross:aarch64-musl
    steps:
      - name: Validate tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-noda\.[0-9]+$'; then
            echo "tag '$TAG' must look like v0.17.0-noda.1" >&2
            exit 1
          fi

      - name: Clone repository at tag
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Check Cargo.toml version matches tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          v=$(grep -m 1 '^version' Cargo.toml | sed -e 's|version = "\(.*\)"|\1|')
          case "$TAG" in
            "v$v"-noda.*) ;;
            *) echo "Cargo.toml says $v but tag is $TAG" >&2; exit 1 ;;
          esac

      - name: Build
        run: cargo build --locked --release --bin sccache --target ${{ matrix.target }} --features=openssl/vendored
        env:
          CARGO_PROFILE_RELEASE_LTO: 'true'

      - name: Smoke test
        if: ${{ startsWith(matrix.target, 'x86_64-') }}
        run: target/${{ matrix.target }}/release/sccache --version

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sccache-${{ inputs.tag }}-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/sccache
          if-no-files-found: error

  release:
    name: release
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Clone repository at tag
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Get artifacts
        uses: actions/download-artifact@v8

      # Same layout and checksum format as upstream releases, so consumers can
      # keep the `sccache-<tag>-<target>.tar.gz` download pattern.
      - name: Create release assets
        run: |
          for d in sccache-*; do
            chmod +x "$d/sccache"
            cp README.md LICENSE "$d/"
            tar -zcvf "$d.tar.gz" "$d"
            echo -n "$(sha256sum "$d.tar.gz" | cut -d ' ' -f 1)" > "$d.tar.gz.sha256"
          done

      - name: Create release
        run: |
          gh release create "$TAG" sccache-*.tar.gz sccache-*.tar.gz.sha256 \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$TAG" \
            --notes "sccache with NODA cache fixes. Built by the noda-release workflow from tag $TAG; each tarball has a matching .sha256 file."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
